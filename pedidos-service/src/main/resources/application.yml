server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: pedidos-service

catalogo:
  service:
    url: ${CATALOGO_SERVICE_URL:http://localhost:8081}

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: pedidos-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        bodega.pedidos.procesamiento.duracion: true
