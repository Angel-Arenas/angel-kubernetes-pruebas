apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pedidos-servicemonitor
  namespace: bodega-peirano
  labels:
    app: pedidos-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: pedidos-service
  namespaceSelector:
    matchNames:
      - bodega-peirano
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 10s
      scrapeTimeout: 5s
