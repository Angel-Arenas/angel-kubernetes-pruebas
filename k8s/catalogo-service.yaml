apiVersion: v1
kind: Service
metadata:
  name: catalogo-service
  namespace: bodega-peirano
  labels:
    app: catalogo-service
    service: catalogo-service
spec:
  type: NodePort
  selector:
    app: catalogo-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
      protocol: TCP
