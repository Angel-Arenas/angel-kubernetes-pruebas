apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: bodega-peirano
  labels:
    app: pedidos-service
    service: pedidos-service
spec:
  type: NodePort
  selector:
    app: pedidos-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP
