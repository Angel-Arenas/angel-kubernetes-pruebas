server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: catalogo-service

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: catalogo-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        bodega.catalogo.consulta.duracion: true
